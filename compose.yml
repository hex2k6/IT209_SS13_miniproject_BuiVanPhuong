name: campus-hub
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: campus_hub
      MYSQL_USER: campus_hub
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-campus_local_demo}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_demo}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  backend:
    image: campus-hub-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/campus_hub?allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: campus_hub
      DB_PASSWORD: ${MYSQL_PASSWORD:-campus_local_demo}
      SERVER_PORT: 8080
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    restart: unless-stopped

volumes:
  mysql_data:
